site_name: VigiaSenior
site_description: Backend didáctico para la gestión y vigilancia de la medicación
theme:
  name: material
  language: es
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
nav:
  - Inicio: index.md
  - Arquitectura del backend: arquitectura-backend.md
  - Implementación de hardware: implementacion-hardware.md
  - Recursos para el alumnado: recursos-alumnado.md
  - Diagramas: diagramas.md
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
